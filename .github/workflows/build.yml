name: Build Emoji Cipher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q EmojiCipher.zip -d extracted
          test -f extracted/EmojiCipher/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Persian font
        working-directory: extracted/EmojiCipher
        run: bash scripts/download_fonts.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/EmojiCipher
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmojiCipher-debug-apk
          path: extracted/EmojiCipher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        working-directory: extracted/EmojiCipher
        run: gradle testDebugUnitTest --stacktrace
